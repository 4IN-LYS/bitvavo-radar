
name: Bitvavo V1.5.4 Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install 'pandas>=2.1,<3'

      - name: Retrieve V1.5.4 history
        shell: bash
        run: |
          git fetch origin shadow-v154-data
          git show FETCH_HEAD:alerts.csv > alerts_v154.csv

      - name: Run prospective audit
        run: |
          python audit_v154.py alerts_v154.csv \
            --output-dir reports/v154_audit

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: bitvavo-v154-audit-${{ github.run_number }}
          path: reports/v154_audit/audit_v154.json
          retention-days: 90
