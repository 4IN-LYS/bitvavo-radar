name: Bitvavo V1.5.3 Shadow
on:
  workflow_dispatch:
  schedule:
    - cron: '27 */2 * * *'
permissions:
  contents: read
concurrency:
  group: bitvavo-v153-shadow
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn==1.8.0' 'joblib>=1.4,<2'
      - name: Restore shadow state (best effort)
        uses: actions/cache/restore@v4
        with:
          path: .shadow_state
          key: bitvavo-v153-${{ github.run_id }}
          restore-keys: |
            bitvavo-v153-
      - name: Scan experimental markets
        run: python shadow_runner_v153.py --markets WLD-EUR NEAR-EUR FET-EUR ONDO-EUR PUMP-EUR
      - name: Save shadow state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .shadow_state
          key: bitvavo-v153-${{ github.run_id }}
      - name: Upload independent shadow alerts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitvavo-v153-shadow-${{ github.run_number }}
          path: reports/shadow_v153.csv
          if-no-files-found: warn
          retention-days: 30
