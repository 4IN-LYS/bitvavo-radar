
name: Bitvavo Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

concurrency:
  group: bitvavo-radar-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MTF_TOP_N: "60"
      DEPTH_TOP_N: "60"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore historical state
        uses: actions/cache/restore@v4
        with:
          path: .radar_state
          key: bitvavo-state-${{ github.run_id }}
          restore-keys: |
            bitvavo-state-

      - name: Run Bitvavo scanner
        run: python scanner.py

      - name: Check liquidity and track outcomes
        run: python enrich.py
        
      - name: Analyze multiple timeframes
        run: python multitimeframe.py

      - name: Calculate V0.5 scores
        run: python scoring_v05.py
      
      - name: Track V0.5.1 signal outcomes
        run: python tracking_v051.py

      - name: Save historical state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .radar_state
          key: bitvavo-state-${{ github.run_id }}

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitvavo-scan-${{ github.run_number }}
          path: |
            reports/*.json
            reports/*.csv
            reports/*.md
          if-no-files-found: error
          retention-days: 30
