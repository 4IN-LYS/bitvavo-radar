
name: Bitvavo Historical Dataset

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Collection scope"
        required: true
        type: choice
        options:
          - test
          - full
        default: test

permissions:
  contents: read

concurrency:
  group: bitvavo-historical-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect historical candles
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          if [[ "$SCOPE" == "test" ]]; then
            python historical_dataset_v01.py --max-markets 5 --pause 0.25 --max-mb 400
          elif [[ "$SCOPE" == "full" ]]; then
            python historical_dataset_v01.py --max-markets 0 --pause 0.25 --max-mb 400
          else
            echo "Invalid scope: $SCOPE"
            exit 1
          fi

      - name: Upload historical dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitvavo-historical-${{ inputs.scope }}-${{ github.run_number }}
          path: |
            historical_data/*.csv.gz
            historical_data/manifest.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
