name: Bitvavo V1.5.5.2 Diagnostic

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed V1.5.5 scope=all run ID'
        type: string
        required: true
        default: '41727462572'

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Download immutable V1.5.5 backtest artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'source_run_id must be numeric' >&2
            exit 1
          fi
          mkdir -p input
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" --dir input
          DATASET="$(find input -type f -name all_eligible_snapshots.csv -print -quit)"
          if [ -z "$DATASET" ]; then
            echo 'Missing all_eligible_snapshots.csv' >&2
            exit 1
          fi
          echo "DATASET=$DATASET" >> "$GITHUB_ENV"
      - name: Check Python syntax
        run: python -m py_compile v1552_diagnostic.py
      - name: Run per-rule and combination diagnostic
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python v1552_diagnostic.py "$DATASET" \
            --source-run-id "$SOURCE_RUN_ID" \
            --output-dir reports/v1552_diagnostic
      - name: Upload V1.5.5.2 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitvavo-v1552-diagnostic-${{ github.run_number }}
          path: reports/v1552_diagnostic/
          if-no-files-found: warn
          retention-days: 90
