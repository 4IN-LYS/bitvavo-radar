name: Bitvavo V1.5.4 Shadow
on:
  workflow_dispatch:
  schedule:
    - cron: '37 */2 * * *'
permissions:
  contents: write
concurrency:
  group: bitvavo-v154-shadow
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn==1.8.0' 'joblib>=1.4,<2'
      - name: Restore durable shadow data from separate branch
        shell: bash
        run: |
          mkdir -p .shadow_v154
          if git fetch origin shadow-v154-data; then
            git show FETCH_HEAD:state.json > .shadow_v154/state.json || true
            git show FETCH_HEAD:alerts.csv > .shadow_v154/alerts.csv || true
          fi
      - name: Scan all trading EUR spot markets and evaluate matured alerts
        run: python shadow_runner_v154.py --workers 3 --max-evaluations 100
      - name: Persist history to data branch
        shell: bash
        run: |
          mkdir -p /tmp/bitvavo-v154-persist
          cp .shadow_v154/state.json .shadow_v154/alerts.csv /tmp/bitvavo-v154-persist/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin shadow-v154-data >/dev/null; then
            git fetch origin shadow-v154-data
            git worktree add -B shadow-v154-data /tmp/bitvavo-v154-worktree FETCH_HEAD
          else
            git worktree add --detach /tmp/bitvavo-v154-worktree HEAD
            cd /tmp/bitvavo-v154-worktree
            git switch --orphan shadow-v154-data
            git rm -rf --quiet . || true
            cd "$GITHUB_WORKSPACE"
          fi
          cp /tmp/bitvavo-v154-persist/* /tmp/bitvavo-v154-worktree/
          cd /tmp/bitvavo-v154-worktree
          git add state.json alerts.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update V1.5.4 prospective observations ($GITHUB_RUN_ID)"
            git push origin HEAD:shadow-v154-data
          fi
      - name: Upload human-readable run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitvavo-v154-summary-${{ github.run_number }}
          path: reports/shadow_v154_summary.json
          if-no-files-found: warn
          retention-days: 30
