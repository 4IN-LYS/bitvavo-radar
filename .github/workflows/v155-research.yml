name: Bitvavo V1.5.5 Historical Research

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Pilot (8 EUR markets including ICNT) or all EUR markets"
        type: choice
        options:
          - pilot
          - all
        default: pilot
        required: true

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Run historical research
        shell: bash
        env:
          RESEARCH_SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$RESEARCH_SCOPE" = 'all' ]; then
            python research_v155.py --all-markets --workers 3
          else
            python research_v155.py --workers 3
          fi
      - name: Save research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v155-historical-${{ inputs.scope }}-${{ github.run_number }}
          path: reports/v155_research/
          if-no-files-found: warn
          retention-days: 90
