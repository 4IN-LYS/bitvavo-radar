          def stamp(s):return dt.datetime.fromisoformat(s.replace('Z','+00:00')).astimezone(dt.timezone.utc)
          volume=json.load(open('inputs/volume_candidate/summary.json'))
          raise SystemExit(0 if stamp(volume['source_scan_utc'])==stamp(os.environ['SCAN_TIME']) else 1)
          PY
              then
                cp inputs/volume_candidate/all_markets.csv inputs/volume/all_markets.csv
                matched=1
                break
              fi
            fi
          done < <(gh run list -R "$REPO" --workflow v192-volume-precursor.yml --status success --limit 25 --json databaseId,number --jq '.[]|[.databaseId,.number]|@tsv')
          if [ "$matched" != 1 ]; then
            echo 'No matching 1.9.2 snapshot found for this exact 1.10.1 audit'; exit 1
          fi
      - name: Classify phases without future price leakage
        run: |
          python phase_engine_v111.py \
            --summary inputs/audit/summary.json \
            --rows inputs/audit/all_markets.csv \
            --volume-rows inputs/volume/all_markets.csv \
            --output-dir reports/v111
      - name: Archive once per source scan (independent history branch)
        shell: bash
        run: |
          set -euo pipefail
          day="$(python - <<'PY'
          import json
          print(json.load(open('reports/v111/summary.json'))['parent_scan_utc'][:10])
          PY
          )"
          stamp="$(python - <<'PY'
          import json
          s=json.load(open('reports/v111/summary.json'))['parent_scan_utc']
          print(s.replace('-','').replace(':','').replace('+00:00','Z'))
          PY
          )"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin v111-phase-data >/dev/null; then
            git fetch origin v111-phase-data
            git worktree add --detach /tmp/v111-archive FETCH_HEAD
          else
            git worktree add --detach /tmp/v111-archive HEAD
            (cd /tmp/v111-archive && git switch --orphan v111-phase-data)
          fi
          dest="/tmp/v111-archive/snapshots/$day"
          mkdir -p "$dest"
          # Keep the first observation for each scan; never silently replace history.
          if [ ! -e "$dest/scan-$stamp.json" ]; then
            cp reports/v111/summary.json "$dest/scan-$stamp.json"
            gzip -c reports/v111/all_markets.csv > "$dest/scan-$stamp.csv.gz"
          fi
          cd /tmp/v111-archive
          git add snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Archive V1.11 classifications for source scan $stamp"
            git push origin HEAD:v111-phase-data
          fi
      - name: Upload phase research output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitvavo-v111-${{ github.run_number }}
          path: reports/v111/
          retention-days: 90
          if-no-files-found: warn
